name: Continuous Deployment (CD)

on:
  # This triggers the CD pipeline after code is pushed to the main branch
  push:
    branches:
      - main
  
  # Alternatively, you can use workflow_run to trigger only after the CI pipeline completes successfully:
  # workflow_run:
  #   workflows: ["CI/CD Pipeline"]
  #   types:
  #     - completed

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    # Ensure this only runs on the main branch
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 2. Build and push Frontend image
      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./Frontend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/nexera-frontend:latest
          build-args: |
            VITE_API_URL=http://${{ secrets.SERVER_HOST }}:4000/api/v1
            VITE_SOCKET_URL=http://${{ secrets.SERVER_HOST }}:4000

      # 3. Build and push Backend image
      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./Backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/nexera-backend:latest

      # 4. Deploy to Server via SSH
      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # Go to the home directory
            cd ~
            
            # Clone the repository if it doesn't exist
            if [ ! -d "Nexera" ]; then
              git clone https://github.com/kavyareddy1313/Nexera.git
            fi
            
            # Navigate into the project folder
            cd Nexera
            
            # Pull the latest changes from git
            git pull origin main
            
            # Pull the latest Docker images from Docker Hub
            docker compose pull
            
            # Restart the services in the background
            docker compose up -d
            
            # Clean up old unused images to save disk space
            docker image prune -f
